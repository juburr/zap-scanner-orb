name: Scan with OWASP ZAP
description: >
  Runs a headless ZAP scan with the Automation Framework and uploads the
  HTML, JSON and Markdown reports as a workflow artifact. Generates a
  baseline (spider and passive scan), full (adds an active scan) or api
  (OpenAPI import and active scan) plan, or runs a custom plan. Full and api
  scans send attacks to the target, so only scan applications you are
  authorized to test. Requires ZAP 2.12.0 or newer, installed with the
  install action earlier in the job. The GitHub Actions twin of the orb's
  scan command.
author: juburr

inputs:
  active_scan_minutes:
    description: Maximum minutes to spend on the active scan, or 0 for no limit. Used by full and api scans.
    default: "10"
  api_definition:
    description: >
      Path or http(s) URL of the OpenAPI definition to import when scan_type
      is api. Its operations are scanned on target rather than on the
      definition's servers, so a relative server such as "/" works. A path in
      target, including a lone trailing "/", replaces the server's path.
    default: ""
  auth_header:
    description: >
      Name of the header that carries auth_header_value. Defaults to
      $ZAP_AUTH_HEADER if set, otherwise Authorization.
    default: ""
  auth_header_site:
    description: >
      Only send the header to sites whose name contains this value. Defaults
      to $ZAP_AUTH_HEADER_SITE if set, otherwise the host of target, so the
      header is never sent to other hosts the scan reaches. Required for
      custom plans without a target.
    default: ""
  auth_header_value:
    description: >
      Name of the environment variable holding a value, such as "Bearer
      <token>", to send in auth_header with every request to
      auth_header_site. Set it from a secret in the step's env, never as a
      literal input. No header is sent when the variable is unset or empty,
      but the step fails if a variable other than the default is named and is
      empty, so a missing secret never silently downgrades to an
      unauthenticated scan.
    default: ZAP_AUTH_HEADER_VALUE
  extra_args:
    description: >
      Extra arguments passed to zap.sh before -autorun, such as "-config
      connection.timeoutInSecs=60". Split on whitespace, so individual
      arguments cannot contain spaces.
    default: ""
  fail_on:
    description: >
      Fails the step if any alert is at or above this risk level: high,
      medium, low, info, or never, which only reports alerts. Ignored when
      plan is set.
    default: medium
  ignore_rules:
    description: >
      ZAP scan rule IDs whose alerts are false positives for this
      application, separated by commas or whitespace, such as "10020, 10038".
      Their alerts are marked as false positives, and left out of the reports
      and the fail_on check. Ignored when plan is set.
    default: ""
  max_memory:
    description: >
      Maximum Java heap size for ZAP, such as 512m or 2g. Set explicitly
      because the JVM otherwise sizes the heap from the host's memory.
    default: 1g
  no_output_timeout:
    description: >
      CircleCI only: how long the orb's scan may run without printing output.
      It has no effect on GitHub Actions; give the step timeout-minutes
      instead.
    default: 30m
  output_dir:
    description: >
      Absolute path of the directory to write the reports, the plan, and the
      ZAP log into. Custom plans see it as $ZAP_REPORT_DIR.
    default: /tmp/zap-reports
  plan:
    description: >
      Path to a custom Automation Framework plan to run instead of a
      generated one. The plan can reference ${ZAP_TARGET} and
      ${ZAP_REPORT_DIR}, which are set to target and output_dir, and must set
      its own pass/fail criteria, since fail_on, ignore_rules, scan_type,
      spider_minutes, and active_scan_minutes are ignored.
    default: ""
  scan_type:
    description: >
      "baseline" spiders the target and reports passive scan alerts without
      attacking it. "full" also runs an active scan. "api" imports
      api_definition instead of spidering, then runs an active scan. Ignored
      when plan is set.
    default: baseline
  spider_minutes:
    description: Maximum minutes to spend spidering the target, or 0 for no limit. Used by baseline and full scans.
    default: "1"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named zap-reports and a random
      suffix, including when the scan fails.
    default: "true"
  target:
    description: >
      URL of the application to scan, such as http://localhost:8080. Required
      unless a custom plan is provided.
    default: ""
  wait_for_target_seconds:
    description: >
      Seconds to wait for the target to respond before scanning, for
      applications started earlier in the job or in a service container. Any
      HTTP response counts. 0 disables waiting.
    default: "60"

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same action
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      run: printf 'name=zap-reports-%s\n' "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: Scan with ZAP
      shell: bash
      env:
        PARAM_ACTIVE_SCAN_MINUTES: ${{ inputs.active_scan_minutes }}
        PARAM_API_DEFINITION: ${{ inputs.api_definition }}
        PARAM_AUTH_HEADER: ${{ inputs.auth_header }}
        PARAM_AUTH_HEADER_SITE: ${{ inputs.auth_header_site }}
        PARAM_AUTH_HEADER_VALUE: ${{ inputs.auth_header_value }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FAIL_ON: ${{ inputs.fail_on }}
        PARAM_IGNORE_RULES: ${{ inputs.ignore_rules }}
        PARAM_MAX_MEMORY: ${{ inputs.max_memory }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PLAN: ${{ inputs.plan }}
        PARAM_SCAN_TYPE: ${{ inputs.scan_type }}
        PARAM_SPIDER_MINUTES: ${{ inputs.spider_minutes }}
        PARAM_TARGET: ${{ inputs.target }}
        PARAM_WAIT_FOR_TARGET_SECONDS: ${{ inputs.wait_for_target_seconds }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/scan.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
