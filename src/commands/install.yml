description: >
  Installs OWASP ZAP from its official GitHub release, after verifying its
  SHA-512 checksum, and places zap.sh on the PATH. Requires a Java runtime
  supported by the chosen ZAP version (Java 17 or newer for current releases,
  for example cimg/openjdk:21.0). From ZAP 2.17.0 onward JAVA_HOME is honored
  when set; earlier releases require java on the PATH. Also requires tar and
  gzip. On Red Hat UBI images, install whichever of Java, tar, and gzip the
  image lacks in an earlier step. Safe to invoke more than once in a job. Run
  this before the orb's other commands.
parameters:
  bin_path:
    type: string
    default: ""
    description: >
      Absolute path of a binary directory for the zap.sh symlink, added to the
      PATH of later steps when it isn't already on it. Environment variables
      are expanded. Defaults to $HOME/bin.
  caching:
    type: boolean
    default: true
    description: >
      Cache the downloaded release archive between jobs, keyed by version,
      CPU architecture and home directory. Only verified archives are cached,
      and a cached archive is verified again before it is installed.
  install_path:
    type: string
    default: ""
    description: >
      Absolute path of the directory to extract ZAP into. It must not exist or
      must be empty. Environment variables are expanded. Defaults to $HOME/zap.
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 verification against this orb's checksum table. "strict"
      (default) fails before downloading anything when the version has no
      checksum in the table. "known_versions" verifies listed versions and
      installs unlisted versions unverified, with a warning. "false" skips
      verification and is not recommended.
  version:
    type: string
    default: "2.17.0"
    description: >
      Version of ZAP to install, such as 2.17.0. A leading "v" is ignored, and
      environment variables are expanded.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # The key is computed from a file that names the CPU (uname -m, as
        # {{ arch }} also encodes the CPU model and would split the cache by
        # host), HOME (a cache is restored to the absolute path it was saved
        # from), and the version with environment variables expanded.
        - run:
            name: Prepare ZAP cache key
            environment:
              ORB_CACHE_KEY_FILE: /tmp/zap-scanner-orb-cache-key
              PARAM_VERSION: << parameters.version >>
            command: << include(scripts/cache_key.sh) >>
        # A saved cache can't be replaced. Bump v1 when an existing checksum
        # table entry changes, so caches saved for the old bytes stop being
        # restored.
        - restore_cache:
            key: zap-scanner-orb-v1-<< parameters.version >>-{{ checksum "/tmp/zap-scanner-orb-cache-key" }}
  - run:
      name: Install ZAP << parameters.version >>
      environment:
        PARAM_BIN_PATH: << parameters.bin_path >>
        PARAM_CACHING: << parameters.caching >>
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(scripts/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: zap-scanner-orb-v1-<< parameters.version >>-{{ checksum "/tmp/zap-scanner-orb-cache-key" }}
            paths:
              - ~/.cache/zap-scanner-orb
