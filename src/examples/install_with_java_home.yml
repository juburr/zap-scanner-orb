description: >
  Install OWASP ZAP on an executor where Java is not on the PATH, such as a
  machine executor, by downloading an Eclipse Temurin 21 runtime in an
  earlier step and pointing JAVA_HOME at it. From ZAP 2.17.0 onward, both
  the install command and zap.sh honor JAVA_HOME. The download needs access
  to api.adoptium.net and GitHub.

usage:
  version: 2.1
  orbs:
    zap-scanner-orb: juburr/zap-scanner-orb@1.1.1
  jobs:
    dast:
      machine:
        image: ubuntu-2404:current
      steps:
        - checkout
        - run:
            name: Download a Temurin 21 JRE into JAVA_HOME
            command: |
              case "$(uname -m)" in
                x86_64) arch=x64 ;;
                aarch64) arch=aarch64 ;;
              esac
              mkdir -p "$HOME/temurin21"
              curl -fsSL --retry 5 "https://api.adoptium.net/v3/binary/latest/21/ga/linux/${arch}/jre/hotspot/normal/eclipse" \
                | tar -xz -C "$HOME/temurin21" --strip-components=1
              echo "export JAVA_HOME=\"$HOME/temurin21\"" >> "$BASH_ENV"
        - zap-scanner-orb/install:
            install_path: $HOME/tools/zap
        - run:
            name: Log ZAP Version
            command: zap.sh -cmd -version
  workflows:
    security:
      jobs:
        - dast
