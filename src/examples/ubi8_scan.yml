description: >
  Scan an application from a Red Hat UBI 8 image. Unlike cimg/openjdk, ubi8/ubi does not include Java, so install
  a headless OpenJDK from the UBI repositories before the install command. Add git-core and openssh-clients to the
  same step if the job runs checkout, since UBI images include neither.

usage:
  version: 2.1
  orbs:
    zap-scanner-orb: juburr/zap-scanner-orb@0
  jobs:
    dast:
      docker:
        - image: registry.access.redhat.com/ubi8/ubi:latest
        - image: bkimminich/juice-shop:latest
      steps:
        - run:
            name: Install Java
            command: dnf install -y java-21-openjdk-headless
        - zap-scanner-orb/install:
            verify_checksums: strict
        - zap-scanner-orb/scan:
            target: http://localhost:3000
            fail_on: medium
  workflows:
    security:
      jobs:
        - dast
