version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  zap-scanner-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

commands:
  verify-install:
    description: >
      Asserts that a completed zap-scanner-orb/install left a working ZAP on the
      PATH. Path parameters are expanded by the shell, so $HOME may be used.
    parameters:
      version:
        type: string
        default: "2.17.0"
      install_path:
        type: string
        default: "$HOME/zap"
      bin_path:
        type: string
        default: "$HOME/bin"
    steps:
      - run:
          name: Verify ZAP << parameters.version >> install
          command: |
            set -euo pipefail
            expected_install="<< parameters.install_path >>"
            expected_bin="<< parameters.bin_path >>"

            echo "zap.sh: $(command -v zap.sh)"
            test "$(command -v zap.sh)" = "${expected_bin}/zap.sh"
            test "$(readlink "${expected_bin}/zap.sh")" = "${expected_install}/zap.sh"
            test -x "${expected_install}/zap.sh"
            test -f "${expected_install}/zap-<< parameters.version >>.jar"
            grep -qx "version=<< parameters.version >>" "${expected_install}/.zap-scanner-orb"

            test "${ZAP_INSTALL_PATH}" = "${expected_install}"
            test "${ZAP_VERSION}" = "<< parameters.version >>"

            # The cleanup step must remove the downloaded archive.
            test ! -e /tmp/zap-orb-download

            # Staging directories must never be left beside the install. Checked
            # with a glob, since ubi-minimal doesn't ship find.
            if compgen -G "$(dirname "${expected_install}")/.zap-install.*" > /dev/null; then
              echo "a staging directory was left beside ${expected_install}"; exit 1
            fi

            zap.sh -cmd -version | tee /tmp/zap-version.txt
            test "$(tail -n 1 /tmp/zap-version.txt)" = "<< parameters.version >>"

jobs:
  install-docker:
    description: Installs ZAP with the orb command on a cimg/openjdk image and verifies it runs.
    parameters:
      java:
        type: string
      resource_class:
        type: string
        default: medium
      version:
        type: string
      caching:
        type: boolean
        default: true
    docker:
      - image: cimg/openjdk:<< parameters.java >>
    resource_class: << parameters.resource_class >>
    steps:
      - zap-scanner-orb/install:
          caching: << parameters.caching >>
          verify_checksums: strict
          version: << parameters.version >>
      - verify-install:
          version: << parameters.version >>

  install-daemon:
    description: >
      Starts the installed ZAP as a headless daemon and queries its API, proving
      the install is fully operational rather than just able to print a version.
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - zap-scanner-orb/install:
          verify_checksums: strict
      - verify-install
      - run:
          name: Start ZAP daemon and query the API
          command: |
            set -euo pipefail
            zap.sh -daemon -host 127.0.0.1 -port 8090 -config api.disablekey=true -Xmx1g > /tmp/zap-daemon.log 2>&1 &
            zap_pid=$!
            for _ in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:8090/JSON/core/view/version/ -o /tmp/zap-api-version.json; then
                break
              fi
              if ! kill -0 "${zap_pid}" 2> /dev/null; then
                echo "ZAP exited before its API became available"
                exit 1
              fi
              sleep 2
            done
            cat /tmp/zap-api-version.json; echo
            grep -q '"version":"2.17.0"' /tmp/zap-api-version.json
            curl -fsS http://127.0.0.1:8090/JSON/core/action/shutdown/; echo
            wait "${zap_pid}"
      - store_artifacts:
          path: /tmp/zap-daemon.log
          destination: zap-daemon.log

  scan-docker:
    description: >
      Scans an nginx service container with the scan command, which must pass
      at fail_on high and leave a complete set of reports behind.
    parameters:
      java:
        type: string
        default: "21.0"
      version:
        type: string
        default: "2.17.0"
      caching:
        type: boolean
        default: true
      scan_type:
        type: string
      api_definition:
        type: string
        default: ""
      report_pattern:
        type: string
        default: "Missing Anti-clickjacking Header"
    docker:
      - image: cimg/openjdk:<< parameters.java >>
      - image: nginx:stable-alpine
    environment:
      SCAN_TARGET: http://localhost/
    steps:
      - checkout
      - zap-scanner-orb/install:
          caching: << parameters.caching >>
          verify_checksums: strict
          version: << parameters.version >>
      - zap-scanner-orb/scan:
          target: $SCAN_TARGET
          scan_type: << parameters.scan_type >>
          api_definition: << parameters.api_definition >>
          fail_on: high
          active_scan_minutes: 3
      - run:
          name: Verify the reports
          command: |
            set -euo pipefail
            for report in report.html report.json report.md plan.yaml zap.log; do
              test -s "/tmp/zap-reports/${report}" || { echo "missing ${report}"; exit 1; }
            done
            grep -qF "<< parameters.report_pattern >>" /tmp/zap-reports/report.json \
              || { echo "report.json lacks '<< parameters.report_pattern >>'"; exit 1; }
            # Expanded from $SCAN_TARGET by the command.
            grep -qF -- "- 'http://localhost/'" /tmp/zap-reports/plan.yaml \
              || { echo "plan.yaml does not target http://localhost/"; exit 1; }
            test ! -e "${HOME}/.ZAP" || { echo "the scan created ${HOME}/.ZAP"; exit 1; }

  scan-auth-header:
    description: >
      Scans an nginx service container that only serves its pages, including a
      link to /members/, to requests carrying the right X-Api-Key header. The
      authenticated scan must reach /members/, while scans without the header,
      or with the header restricted to another site, must not.
    parameters:
      java:
        type: string
        default: "21.0"
      version:
        type: string
        default: "2.17.0"
      caching:
        type: boolean
        default: true
    docker:
      - image: cimg/openjdk:<< parameters.java >>
      - image: nginx:stable-alpine
        command:
          - sh
          - -c
          - |
            cat > /etc/nginx/conf.d/default.conf \<< 'EOF'
            server {
                listen 80;
                default_type text/html;
                location = / {
                    if ($http_x_api_key != "ci-test-token") { return 401; }
                    return 200 '<html><body><a href="/members/">Members</a></body></html>';
                }
                location = /members/ {
                    if ($http_x_api_key != "ci-test-token") { return 401; }
                    return 200 '<html><body>Members only</body></html>';
                }
            }
            EOF
            exec nginx -g 'daemon off;'
    environment:
      SCAN_TOKEN: ci-test-token
    steps:
      - zap-scanner-orb/install:
          caching: << parameters.caching >>
          verify_checksums: strict
          version: << parameters.version >>
      - zap-scanner-orb/scan:
          target: http://localhost/
          auth_header: X-Api-Key
          auth_header_value: SCAN_TOKEN
          fail_on: never
          report_dir: /tmp/zap-authenticated
      - zap-scanner-orb/scan:
          target: http://localhost/
          fail_on: never
          report_dir: /tmp/zap-unauthenticated
          store_artifacts: false
      - zap-scanner-orb/scan:
          target: http://127.0.0.1/
          auth_header: X-Api-Key
          auth_header_value: SCAN_TOKEN
          auth_header_site: localhost
          fail_on: never
          report_dir: /tmp/zap-other-site
          store_artifacts: false
      - run:
          name: Verify the header was sent only where expected
          command: |
            set -euo pipefail
            grep -qF "http://localhost/members/" /tmp/zap-authenticated/report.json \
              || { echo "the authenticated scan did not reach /members/"; exit 1; }
            if grep -qF "/members/" /tmp/zap-unauthenticated/report.json; then
              echo "the unauthenticated scan reached /members/"; exit 1
            fi
            if grep -qF "/members/" /tmp/zap-other-site/report.json; then
              echo "the header was sent to a site other than auth_header_site"; exit 1
            fi
            if grep -rqF "${SCAN_TOKEN}" /tmp/zap-authenticated /tmp/zap-unauthenticated /tmp/zap-other-site; then
              echo "the header value was written to the reports, plan, or log"; exit 1
            fi

  scan-ignore-rules:
    description: >
      Scans an nginx service container at fail_on medium while ignoring the
      only two medium risk rules it raises. The scan must pass, with those
      alerts absent from every report and the low risk alerts still present.
    parameters:
      java:
        type: string
        default: "21.0"
      version:
        type: string
        default: "2.17.0"
      caching:
        type: boolean
        default: true
    docker:
      - image: cimg/openjdk:<< parameters.java >>
      - image: nginx:stable-alpine
    steps:
      - zap-scanner-orb/install:
          caching: << parameters.caching >>
          verify_checksums: strict
          version: << parameters.version >>
      - zap-scanner-orb/scan:
          target: http://localhost/
          fail_on: medium
          # Missing Anti-clickjacking Header and CSP Header Not Set.
          ignore_rules: "10020, 10038"
      - run:
          name: Verify the ignored alerts are left out
          command: |
            set -euo pipefail
            grep -qF "type: alertFilter" /tmp/zap-reports/plan.yaml || { echo "plan has no alertFilter job"; exit 1; }
            for report in report.json report.html report.md; do
              for alert in "Missing Anti-clickjacking Header" "Content Security Policy (CSP) Header Not Set"; do
                if grep -qF "${alert}" "/tmp/zap-reports/${report}"; then
                  echo "${report} still contains the ignored alert '${alert}'"; exit 1
                fi
              done
            done
            grep -qF "X-Content-Type-Options Header Missing" /tmp/zap-reports/report.json \
              || { echo "report.json lost an alert that was not ignored"; exit 1; }

  scan-custom-plan:
    description: >
      Runs a custom Automation Framework plan with the scan command, writing
      reports to a non-default directory without storing them as artifacts.
    docker:
      - image: cimg/openjdk:21.0
      - image: nginx:stable-alpine
    steps:
      - checkout
      - zap-scanner-orb/install:
          verify_checksums: strict
      - zap-scanner-orb/scan:
          plan: .circleci/zap/custom-plan.yaml
          target: http://localhost/
          report_dir: /tmp/custom zap reports
          store_artifacts: false
          max_memory: 768m
      - run:
          name: Verify the plan's report
          command: |
            set -euo pipefail
            test -s "/tmp/custom zap reports/custom.json"
            test -s "/tmp/custom zap reports/zap.log"
            test ! -e "/tmp/custom zap reports/plan.yaml"
            test ! -e /tmp/zap-reports

  scan-script-tests:
    description: >
      Runs the scan script directly against failure and edge cases that can't
      be asserted through the orb command, plus real scans of each type.
    docker:
      - image: cimg/openjdk:21.0
      - image: nginx:stable-alpine
    steps:
      - checkout
      - zap-scanner-orb/install:
          verify_checksums: strict
      - run:
          name: Run scan script tests
          command: SCAN_TARGET=http://localhost/ bash .circleci/scripts/scan_script_tests.sh

  install-custom-paths:
    description: >
      Installs into directories that contain spaces and are not on the PATH,
      using environment variables in the paths and with caching disabled.
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - zap-scanner-orb/install:
          caching: false
          install_path: $HOME/zap tools/zap
          bin_path: $HOME/zap tools/bin
          verify_checksums: strict
      - verify-install:
          install_path: $HOME/zap tools/zap
          bin_path: $HOME/zap tools/bin

  install-idempotent:
    description: Invokes the install command twice in one job, which must succeed without reinstalling.
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - zap-scanner-orb/install:
          verify_checksums: strict
      - run:
          name: Record install state
          command: stat -c '%i %Y' "${HOME}/zap/zap-2.17.0.jar" > /tmp/first-install.txt
      - zap-scanner-orb/install:
          verify_checksums: strict
      - run:
          name: Verify the second invocation did not reinstall
          command: |
            set -euo pipefail
            diff /tmp/first-install.txt <(stat -c '%i %Y' "${HOME}/zap/zap-2.17.0.jar")
            # BASH_ENV must remain valid after being appended to twice.
            test "$(command -v zap.sh)" = "${HOME}/bin/zap.sh"
      - verify-install

  install-root-image:
    description: >
      Installs on a stock eclipse-temurin image, which runs as root, has no
      /home/circleci, and may not ship the CircleCI CLI. Exercises the $HOME
      defaults and the literal-value fallback for parameter expansion.
    docker:
      - image: eclipse-temurin:21-jre
    steps:
      - run:
          name: Describe the environment
          command: |
            id
            echo "HOME=${HOME}"
            echo "JAVA_HOME=${JAVA_HOME:-}"
            command -v circleci || echo "CircleCI CLI not present"
      - zap-scanner-orb/install:
          verify_checksums: strict
      - verify-install:
          install_path: /root/zap
          bin_path: /root/bin
      - run:
          name: Verify files are owned by the installing user
          command: test -z "$(find /root/zap ! -user root -print -quit)"

  install-machine:
    description: >
      Installs on a machine executor with a Java runtime that is only reachable
      through JAVA_HOME, verifying JAVA_HOME is honored.
    parameters:
      resource_class:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    steps:
      - run:
          name: Download a Temurin 17 JRE into JAVA_HOME only
          command: |
            set -euo pipefail
            case "$(uname -m)" in
              x86_64) arch=x64 ;;
              aarch64) arch=aarch64 ;;
              *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
            esac
            mkdir -p "${HOME}/temurin17"
            curl -fsSL --retry 5 "https://api.adoptium.net/v3/binary/latest/17/ga/linux/${arch}/jre/hotspot/normal/eclipse" \
              | tar -xz -C "${HOME}/temurin17" --strip-components=1
            echo "export JAVA_HOME=\"${HOME}/temurin17\"" >> "${BASH_ENV}"
      - zap-scanner-orb/install:
          verify_checksums: strict
      - verify-install

  ubi:
    description: >
      Installs Java and any other missing prerequisites on a Red Hat UBI image
      with the image's own package manager, as the README describes, then
      installs ZAP and scans an nginx service container.
    parameters:
      image:
        description: Image under registry.access.redhat.com, such as ubi8/ubi:latest.
        type: string
      setup:
        description: Command that installs the prerequisites the image lacks.
        type: string
      java:
        description: Java version the image provides once set up, such as 21 or 1.8.
        type: string
      resource_class:
        type: string
        default: medium
      version:
        type: string
        default: "2.17.0"
      caching:
        type: boolean
        default: true
      scan:
        type: boolean
        default: true
    docker:
      - image: registry.access.redhat.com/<< parameters.image >>
        # The UBI OpenJDK images run as uid 185, which can't install packages.
        user: root
      - image: nginx:stable-alpine
    resource_class: << parameters.resource_class >>
    steps:
      - run:
          name: Install prerequisites
          command: << parameters.setup >>
      - run:
          name: Verify the Red Hat Java is in use
          command: |
            set -euo pipefail
            cat /etc/redhat-release
            id
            echo "HOME=${HOME}"
            echo "JAVA_HOME=${JAVA_HOME:-}"
            java_bin="${JAVA_HOME:+${JAVA_HOME}/bin/}java"
            "${java_bin}" -version 2>&1 | tee /tmp/java-version.txt
            case "$(readlink -f "$(command -v "${java_bin}")")" in
              /usr/lib/jvm/*) ;;
              *) echo "expected ${java_bin} to be a Red Hat OpenJDK package under /usr/lib/jvm"; exit 1 ;;
            esac
            grep -qE 'version "<< parameters.java >>[."]' /tmp/java-version.txt \
              || { echo "expected Java << parameters.java >>"; exit 1; }
      - zap-scanner-orb/install:
          caching: << parameters.caching >>
          verify_checksums: strict
          version: << parameters.version >>
      - verify-install:
          version: << parameters.version >>
      - when:
          condition: << parameters.scan >>
          steps:
            - zap-scanner-orb/scan:
                target: http://localhost/
                fail_on: high
            - run:
                name: Verify the reports
                command: |
                  set -euo pipefail
                  for report in report.html report.json report.md plan.yaml zap.log; do
                    test -s "/tmp/zap-reports/${report}" || { echo "missing ${report}"; exit 1; }
                  done
                  grep -qF "Missing Anti-clickjacking Header" /tmp/zap-reports/report.json \
                    || { echo "report.json lacks the expected alert"; exit 1; }

  script-tests-ubi8:
    description: >
      Runs the install and scan script tests on Red Hat UBI 8, exercising the
      scripts against RHEL's userland and its OpenJDK packages.
    docker:
      - image: registry.access.redhat.com/ubi8/ubi:latest
      - image: nginx:stable-alpine
    steps:
      - run:
          name: Install Java, and the tools checkout and the tests need
          # The tests use wget for their wget fallback case, diff and cmp
          # (diffutils) for comparisons, and python3 and openssl to serve HTTPS
          # with a self-signed certificate. The orb itself needs none of them.
          command: dnf install -y java-21-openjdk-headless git-core openssh-clients wget diffutils python3 openssl
      - checkout
      - restore_cache:
          key: zap-scanner-orb-v1-2.17.0
      - run:
          name: Run install script tests
          command: SEED_ARCHIVE=/tmp/zap-orb-download/zap.tar.gz bash .circleci/scripts/install_script_tests.sh
      - zap-scanner-orb/install:
          verify_checksums: strict
      - run:
          name: Run scan script tests
          command: SCAN_TARGET=http://localhost/ bash .circleci/scripts/scan_script_tests.sh

  install-cache-roundtrip:
    description: >
      Verifies the archive saved by earlier installs is restored from the cache,
      still matches the checksum table, and is used instead of downloading.
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          key: zap-scanner-orb-v1-2.17.0
      - run:
          name: Verify the cached archive
          command: |
            set -euo pipefail
            test -f /tmp/zap-orb-download/zap.tar.gz
            expected=$(grep -oP '\["2\.17\.0"\]="\K[0-9a-f]{128}' src/scripts/install.sh)
            test "$(sha512sum /tmp/zap-orb-download/zap.tar.gz | awk '{ print $1 }')" = "${expected}"
      - run:
          name: Install from the cached archive
          command: |
            set -euo pipefail
            PARAM_INSTALL_PATH="${HOME}/zap" \
            PARAM_BIN_PATH="${HOME}/bin" \
            PARAM_VERIFY_CHECKSUMS=strict \
            PARAM_VERSION=2.17.0 \
            ZAP_ORB_DOWNLOAD_DIR=/tmp/zap-orb-download \
            bash src/scripts/install.sh | tee /tmp/install.log
            grep -q "Using cached ZAP 2.17.0 archive." /tmp/install.log
            if grep -q "Downloading" /tmp/install.log; then
              echo "expected the cached archive to be used"
              exit 1
            fi
            rm -rf /tmp/zap-orb-download
      - verify-install

  install-script-tests:
    description: >
      Runs the install script directly against failure and edge cases that
      can't be asserted through the orb command: malformed input, missing
      tools, old or unparseable Java, cache corruption, and more.
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          key: zap-scanner-orb-v1-2.17.0
      - run:
          name: Run install script tests
          command: SEED_ARCHIVE=/tmp/zap-orb-download/zap.tar.gz bash .circleci/scripts/install_script_tests.sh

  checksum-table:
    description: >
      Re-derives every entry in the checksum table from the checksums the ZAP
      project published (recorded in upstream_checksums.txt), and ensures the
      default version and every test matrix entry are covered.
    docker:
      - image: cimg/base:current-24.04
    resource_class: large
    steps:
      - checkout
      - run:
          name: Verify table coverage
          command: |
            set -euo pipefail
            grep -oE '^\s*\["[0-9]+\.[0-9]+\.[0-9]+"\]="[0-9a-f]{128}"' src/scripts/install.sh | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V > /tmp/table-versions.txt
            grep -vE '^\s*(#|$)' src/scripts/upstream_checksums.txt | awk '{ print $1 }' | sort -V > /tmp/upstream-versions.txt
            echo "Pinned versions: $(tr '\n' ' ' < /tmp/table-versions.txt)"
            diff /tmp/table-versions.txt /tmp/upstream-versions.txt

            default=$(awk '/^  version:/ { f = 1 } f && /default:/ { gsub(/"/, "", $2); print $2; exit }' src/commands/install.yml)
            echo "Default version: ${default}"
            grep -qx "${default}" /tmp/table-versions.txt

            # Every pinned version must be installed by at least one test job.
            for version in $(cat /tmp/table-versions.txt); do
              grep -qE "\"${version//./\\.}\"" .circleci/test-deploy.yml || { echo "No install test for ${version}"; exit 1; }
            done
      - run:
          name: Re-derive checksums from upstream
          command: |
            set -euo pipefail
            grep -oE '^\s*\["[0-9]+\.[0-9]+\.[0-9]+"\]="[0-9a-f]{128}"' src/scripts/install.sh | tr -d ' ' | sort -V > /tmp/table.txt
            # Anchor purely on the recorded checksums, avoiding GitHub API rate limits.
            grep -vE '^\s*(#|$)' src/scripts/upstream_checksums.txt | awk '{ print $1, $2 }' \
              | SKIP_RELEASE_NOTES=true xargs -P 6 -n 2 sh -c 'bash src/scripts/install_hash.sh -v "$1" -c "$2"' _ \
              | sort -V > /tmp/derived.txt
            diff /tmp/table.txt /tmp/derived.txt
            echo "All $(wc -l < /tmp/table.txt) checksums re-derived from upstream."

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      - install-docker:
          matrix:
            alias: install-java-matrix
            parameters:
              java: ["17.0", "21.0", "25.0"]
              resource_class: [medium, arm.medium]
              version: ["2.17.0"]
          filters: *filters
      # Every other pinned release, each on the oldest Java it supports. Caching
      # is disabled so these don't accumulate cache storage.
      - install-docker:
          matrix:
            alias: install-java8-matrix
            parameters:
              java: ["8.0"]
              version: ["2.4.0", "2.4.2", "2.4.3", "2.5.0", "2.7.0", "2.8.0", "2.8.1", "2.9.0", "2.10.0", "2.11.0", "2.11.1"]
          caching: false
          filters: *filters
      - install-docker:
          matrix:
            alias: install-java11-matrix
            parameters:
              java: ["11.0"]
              version: ["2.12.0", "2.13.0", "2.14.0", "2.15.0"]
          caching: false
          filters: *filters
      # 2.16.0's launcher claims Java 11, but its classes require Java 17.
      - install-docker:
          matrix:
            alias: install-java17-matrix
            parameters:
              java: ["17.0"]
              version: ["2.16.0", "2.16.1"]
          caching: false
          filters: *filters
      # The oldest release whose launcher accepts modern Java versions.
      - install-docker:
          name: install-docker-25.0-medium-2.7.0
          java: "25.0"
          version: "2.7.0"
          caching: false
          filters: *filters
      - install-daemon:
          filters: *filters
      - scan-docker:
          name: scan-baseline
          scan_type: baseline
          filters: *filters
      - scan-docker:
          name: scan-full
          scan_type: full
          filters: *filters
      - scan-docker:
          name: scan-api
          scan_type: api
          api_definition: .circleci/zap/openapi.json
          report_pattern: /api/items
          filters: *filters
      # The oldest release the scan command supports, on the oldest Java it supports.
      - scan-docker:
          name: scan-baseline-2.12.0
          java: "11.0"
          version: "2.12.0"
          caching: false
          scan_type: baseline
          filters: *filters
      - scan-auth-header:
          filters: *filters
      - scan-auth-header:
          name: scan-auth-header-2.12.0
          java: "11.0"
          version: "2.12.0"
          caching: false
          filters: *filters
      - scan-ignore-rules:
          filters: *filters
      - scan-ignore-rules:
          name: scan-ignore-rules-2.12.0
          java: "11.0"
          version: "2.12.0"
          caching: false
          filters: *filters
      - scan-custom-plan:
          filters: *filters
      - scan-script-tests:
          filters: *filters
      - install-custom-paths:
          filters: *filters
      - install-idempotent:
          filters: *filters
      - install-root-image:
          filters: *filters
      - install-machine:
          matrix:
            parameters:
              resource_class: [medium, arm.medium]
          filters: *filters
      # Red Hat UBI, with Java and any other missing tools installed from the
      # UBI repositories rather than preinstalled as on cimg/openjdk.
      - ubi:
          name: ubi8-java21
          image: ubi8/ubi:latest
          setup: dnf install -y java-21-openjdk-headless
          java: "21"
          filters: *filters
      - ubi:
          name: ubi8-java21-arm64
          image: ubi8/ubi:latest
          setup: dnf install -y java-21-openjdk-headless
          java: "21"
          resource_class: arm.medium
          filters: *filters
      - ubi:
          name: ubi8-java17
          image: ubi8/ubi:latest
          setup: dnf install -y java-17-openjdk-headless
          java: "17"
          filters: *filters
      # The oldest release the scan command supports, on the oldest Java it supports.
      - ubi:
          name: ubi8-java11-2.12.0
          image: ubi8/ubi:latest
          setup: dnf install -y java-11-openjdk-headless
          java: "11"
          version: "2.12.0"
          caching: false
          filters: *filters
      # The newest release that only runs on Java 7 or 8, whose launcher parses
      # the 1.8 version itself. Scanning needs a newer ZAP.
      - ubi:
          name: ubi8-java8-2.5.0
          image: ubi8/ubi:latest
          setup: dnf install -y java-1.8.0-openjdk-headless
          java: "1.8"
          version: "2.5.0"
          caching: false
          scan: false
          filters: *filters
      # With several Java packages installed, alternatives defaults to Java 8.
      - ubi:
          name: ubi8-java8-and-21-java-home
          image: ubi8/ubi:latest
          setup: |
            dnf install -y java-1.8.0-openjdk-headless java-21-openjdk-headless
            echo 'export JAVA_HOME=/usr/lib/jvm/jre-21' >> "${BASH_ENV}"
          java: "21"
          filters: *filters
      # Releases before 2.17.0 ignore JAVA_HOME.
      - ubi:
          name: ubi8-java8-and-21-alternatives-2.16.1
          image: ubi8/ubi:latest
          setup: |
            dnf install -y java-1.8.0-openjdk-headless java-21-openjdk-headless
            alternatives --set java "$(readlink -f /usr/lib/jvm/jre-21/bin/java)"
          java: "21"
          version: "2.16.1"
          caching: false
          filters: *filters
      # ubi-minimal also lacks tar and gzip.
      - ubi:
          name: ubi8-minimal-java21
          image: ubi8/ubi-minimal:latest
          setup: microdnf install -y tar gzip java-21-openjdk-headless
          java: "21"
          filters: *filters
      # Red Hat's OpenJDK images include Java and tar, but not gzip.
      - ubi:
          name: ubi8-openjdk-21
          image: ubi8/openjdk-21:latest
          setup: microdnf install -y gzip
          java: "21"
          filters: *filters
      - ubi:
          name: ubi8-openjdk-17-runtime
          image: ubi8/openjdk-17-runtime:latest
          setup: microdnf install -y gzip
          java: "17"
          filters: *filters
      - ubi:
          name: ubi9-java21
          image: ubi9/ubi:latest
          setup: dnf install -y java-21-openjdk-headless
          java: "21"
          filters: *filters
      - ubi:
          name: ubi9-openjdk-21
          image: ubi9/openjdk-21:latest
          setup: microdnf install -y gzip
          java: "21"
          filters: *filters
      - script-tests-ubi8:
          filters: *filters
      - install-cache-roundtrip:
          # The 2.17.0 installs populate the cache this job restores.
          requires: [install-java-matrix]
          filters: *filters
      - install-script-tests:
          filters: *filters
      - checksum-table:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/zap-scanner-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - install-java-matrix
            - install-java8-matrix
            - install-java11-matrix
            - install-java17-matrix
            - install-docker-25.0-medium-2.7.0
            - install-daemon
            - install-custom-paths
            - install-idempotent
            - install-root-image
            - install-machine
            - install-cache-roundtrip
            - install-script-tests
            - checksum-table
            - scan-baseline
            - scan-full
            - scan-api
            - scan-baseline-2.12.0
            - scan-auth-header
            - scan-auth-header-2.12.0
            - scan-ignore-rules
            - scan-ignore-rules-2.12.0
            - scan-custom-plan
            - scan-script-tests
            - ubi8-java21
            - ubi8-java21-arm64
            - ubi8-java17
            - ubi8-java11-2.12.0
            - ubi8-java8-2.5.0
            - ubi8-java8-and-21-java-home
            - ubi8-java8-and-21-alternatives-2.16.1
            - ubi8-minimal-java21
            - ubi8-openjdk-21
            - ubi8-openjdk-17-runtime
            - ubi9-java21
            - ubi9-openjdk-21
            - script-tests-ubi8
          context: orb-publishing
          filters: *release-filters
